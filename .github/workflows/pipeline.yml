name : CI Python LIA

on:
  push:
    branches: [main,develop]
  pull_request:
    branches: [main,develop]

  #=========================
  # Inico Dos Estegios de CI
  #=========================

jobs:
  tests:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Seleciona Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.14

      - name: Instala Dependencias  
        working-directory: ./lia_backend      
        run:  |
          python3 -m pip install --upgrade pip
          pip install uv
          uv sync 
          uv add pytest
          
      
      - name: Executa Testes
        working-directory: ./lia_backend
        run: |
          pwd
          ls -la
          uv run python3 -m pytest -v
  
#=========================
# Inico Build
#=========================
  build:
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Seleciona Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.14

      - name: Instala build
        working-directory: ./lia_backend
        run: |
          python3 -m pip install --upgrade pip
          pip install uv
          uv add build

      - name: Executa Build
        working-directory: ./lia_backend
        run: |
          uv run python3 -m build

  
#=========================
# Inico CodeQL
#=========================        

  codeql:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Configura CodeQl
        uses: github/codeql-action/init@v4
        with:
          languages: python
      - name: Executa CodeQl
        uses: github/codeql-action/analyze@v4

      