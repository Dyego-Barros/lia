services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lash}
      POSTGRES_DB: ${POSTGRES_DB:-lash}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [lia_network]

  npm-db:
    image: jc21/mariadb-aria:latest
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${NPM_DB_ROOT_PASSWORD:?NPM_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: npm
      MYSQL_USER: npm
      MYSQL_PASSWORD: ${NPM_DB_PASSWORD:?NPM_DB_PASSWORD}
    volumes:
      - npm_db_data:/var/lib/mysql
    networks: [lia_network]

  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:2.15.1
    restart: unless-stopped
    environment:
      DB_MYSQL_HOST: npm-db
      DB_MYSQL_PORT: 3306
      DB_MYSQL_USER: npm
      DB_MYSQL_PASSWORD: ${NPM_DB_PASSWORD:?NPM_DB_PASSWORD}
      DB_MYSQL_NAME: npm
      DISABLE_IPV6: ${NPM_DISABLE_IPV6:-true}
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    depends_on:
      npm-db:
        condition: service_started
    networks: [lia_network]

  mongodb:
    # MongoDB 8.3.x aborts on Linux kernel 6.19+. 8.0.4 is used for local
    # compatibility while the host kernel is updated to a supported version.
    image: mongo:8.0.4
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [lia_network]

  openwa:
    image: ${OPENWA_IMAGE:-rmyndharis/openwa:0.23.3}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 2785
      DATABASE_TYPE: sqlite
      DATABASE_SYNCHRONIZE: "true"
      AUTO_START_SESSIONS: "true"
      SESSION_DATA_PATH: /app/data/sessions
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/data/media
      API_MASTER_KEY: ${OPENWA_API_KEY:?OPENWA_API_KEY precisa ser configurado}
      # The dashboard is accessed directly over localhost:2785 during testing.
      # Without TLS, production CSP would upgrade its scripts to https and show a blank page.
      CSP_UPGRADE_INSECURE_REQUESTS: ${CSP_UPGRADE_INSECURE_REQUESTS:-false}
      SERVE_DASHBOARD: "true"
      SSRF_ALLOWED_HOSTS: api
    volumes:
      - openwa_data:/app/data
    ports:
      - "127.0.0.1:${OPENWA_PORT:-2785}:2785"
    depends_on:
      api:
        condition: service_started
    networks: [lia_network]

  pagadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks: [lia_network]

  api:
    build:
      context: ./lia_backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-lash}:${POSTGRES_PASSWORD:-lash}@postgres:5432/${POSTGRES_DB:-lash}
      ALEMBIC_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-lash}:${POSTGRES_PASSWORD:-lash}@postgres:5432/${POSTGRES_DB:-lash}
      MONGODB_URL: ${MONGODB_URL:-mongodb://mongodb:27017}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-lash}
      MONGODB_MAX_MESSAGES: ${MONGODB_MAX_MESSAGES:-2000}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET precisa ser configurado}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:?INTEGRATION_ENCRYPTION_KEY precisa ser configurado}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:?INITIAL_ADMIN_EMAIL precisa ser configurado}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?INITIAL_ADMIN_PASSWORD precisa ser configurado}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      APP_ENV: ${APP_ENV:-production}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gpt-oss:120b}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-https://ollama.com/v1}
      AI_PROVIDER_ORDER: ${AI_PROVIDER_ORDER:-groq,ollama,openai}
      PHONE_NUMBER_ID: ${PHONE_NUMBER_ID:-}
      BUSINESS_ID: ${BUSINESS_ID:-}
      ZAP_TOKEN: ${ZAP_TOKEN:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v20.0}
      ULTRAMSG_INSTANCE_ID: ${ULTRAMSG_INSTANCE_ID:-}
      ULTRAMSG_TOKEN: ${ULTRAMSG_TOKEN:-}
      ULTRAMSG_WEBHOOK_SECRET: ${ULTRAMSG_WEBHOOK_SECRET:-}
      OPENWA_WEBHOOK_URL: ${OPENWA_WEBHOOK_URL:-http://api:8000/webhooks/openwa}
      OPENWA_WEBHOOK_SECRET: ${OPENWA_WEBHOOK_SECRET:?OPENWA_WEBHOOK_SECRET precisa ser configurado}
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    volumes:
      - "./lia_backend/app:/app/app"
    # ports:
    #   - "127.0.0.1:${API_PORT:-8000}:8000"
    networks: [lia_network]

  frontend:
    build:
      context: ./lia_frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    environment:
      NODE_ENV: production
    ports:
       - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - api
    networks: [lia_network]

networks:
  lia_network:
    driver: bridge

volumes:
  postgres_data:
  npm_db_data:
  npm_data:
  npm_letsencrypt:
  mongodb_data:
  openwa_data:
  pgadmin_data:
